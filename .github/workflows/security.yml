name: dependency and image scans
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit --require-hashes -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: npm audit --prefix web --omit=dev --audit-level=high
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: .
          - image: web
            context: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: gridcast-${{ matrix.image }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gridcast-${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
