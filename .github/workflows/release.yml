name: ACA release
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [Preview, Deploy, Rollback]
        default: Preview
      git_sha:
        description: Immutable commit SHA for both images (previous SHA for rollback)
        required: true
      build_images:
        description: Build SHA-tagged images before Deploy; never used for Preview or Rollback
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: gridcast-aca-staging
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: staging
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: ${{ vars.ACA_PREFIX }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      RELEASE_SHA: ${{ inputs.git_sha }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - shell: pwsh
        run: |
          if ($env:RELEASE_SHA -notmatch '^[a-f0-9]{40}$') { throw 'A full git SHA is required.' }
      - uses: actions/checkout@v4
        if: inputs.operation == 'Deploy' && inputs.build_images
        with:
          ref: ${{ inputs.git_sha }}
          path: release-source
      - if: inputs.operation == 'Deploy' && inputs.build_images
        shell: pwsh
        run: |
          az acr build --registry $env:ACR_NAME --platform linux/amd64 --image "gridcast-api:$env:RELEASE_SHA" ./release-source
          if ($LASTEXITCODE) { throw 'API image build failed.' }
          az acr build --registry $env:ACR_NAME --platform linux/amd64 --image "gridcast-web:$env:RELEASE_SHA" ./release-source/web
          if ($LASTEXITCODE) { throw 'Web image build failed.' }
          foreach ($image in @('gridcast-api', 'gridcast-web')) {
            az acr repository update --name $env:ACR_NAME --image "${image}:$env:RELEASE_SHA" --write-enabled false --delete-enabled false
            if ($LASTEXITCODE) { throw 'Could not protect release image tag.' }
          }
      - shell: pwsh
        run: |
          $extra = @()
          if (Test-Path infra/azure/staging.parameters.json) {
            $extra = @('-ParametersFile', 'infra/azure/staging.parameters.json')
          }
          ./scripts/Deploy-Aca.ps1 -ResourceGroup $env:RESOURCE_GROUP -Prefix $env:PREFIX `
            -ReleaseTag $env:RELEASE_SHA -EntraClientId $env:ENTRA_CLIENT_ID `
            -EntraTenantId $env:AZURE_TENANT_ID -Operation $env:OPERATION `
            -StatePath "$env:RUNNER_TEMP/release-state.json" @extra
      - uses: actions/upload-artifact@v4
        if: always() && inputs.operation != 'Preview'
        with:
          name: release-state
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: warn
